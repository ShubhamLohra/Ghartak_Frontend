<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Circle -->
  <rect x="10" y="10" width="180" height="180" rx="48" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="168" height="168" rx="42" fill="none" stroke="#F59E0B" stroke-width="4" opacity="0.7"/>

  <!-- Modern House Roof Peak -->
  <path d="M 45 95 L 100 48 L 155 95" fill="none" stroke="url(#amberGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Chimney Accent -->
  <path d="M 132 72 L 132 58 L 144 58 L 144 82" fill="url(#amberGrad)" />

  <!-- Main Stylized 'G' & Door Structure -->
  <path d="M 68 112 C 68 98 80 88 100 88 C 120 88 132 98 132 112 C 132 135 100 152 100 152 C 100 152 68 135 68 112 Z" fill="#FFFFFF" />

  <!-- Inner Sparkle / Check Mark in Door -->
  <path d="M 90 114 L 97 121 L 112 104" fill="none" stroke="#4F46E5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
